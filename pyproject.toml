[project]
name = "dog-skin-screening"
version = "0.1.0"
description = "반려견 피부 병변 스크리닝 보조 모델 (AI Hub 561) — 진단이 아니라 '병원 가보세요' 까지"
requires-python = ">=3.10"

# ─────────────────────────────────────────────────────────────────
# 기본 의존성 = **전처리만** 돌리는 데 필요한 것 (torch 없음)
#
# 로컬 PC 는 원본 이미지를 크롭해서 zip 으로 묶는 일만 합니다.
# 거기에 2GB 짜리 torch 를 깔 이유가 없어서 일부러 뺐습니다.
#   uv sync            → 이만큼만 (로컬 전처리용)
#   uv sync --extra train → torch 까지 (학습까지 로컬에서 할 때)
# ─────────────────────────────────────────────────────────────────
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",          # parquet 매니페스트
    "Pillow>=10.2",
    "scikit-learn>=1.4",      # StratifiedGroupKFold, 지표
    "imagehash>=4.3",         # 중복 탐지용 perceptual hash
    "opencv-python-headless>=4.9",
    "tqdm>=4.66",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# 학습·평가. Colab / Kaggle 에는 torch 가 이미 깔려 있으므로
# 노트북 첫 셀은 이 extra 를 쓰지 않고 timm 등 몇 개만 pip 로 얹습니다.
train = [
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=1.0.9",            # 백본 팩토리 (ConvNeXt-V2 / EVA-02 / SigLIP / DINOv3)
    "grad-cam>=1.5",          # 노트북 05 의 필수 검증 게이트
    # 학습 중 실시간 증강. torchvision(PIL) 보다 빠르고 기법이 많습니다.
    # bench 실측에서 증강·변환이 18.0ms 로 파이프라인 병목이었습니다.
    "albumentations>=1.4",
]

# 데모 API 서버 (serve.py). 앱이 붙을 자리를 로컬에서 띄워보는 용도입니다.
# --mock 으로 돌리면 torch 없이 화면만 확인할 수 있어서 train 과 분리했습니다.
#   uv sync --extra serve                 → 화면만 (mock)
#   uv sync --extra train --extra serve   → 진짜 모델로
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",   # multipart 업로드 (FastAPI 가 런타임에 요구)
]

[tool.uv]
# src/ 는 `from src import env` 로 **경로에서 직접** 임포트합니다.
# 설치 대상 패키지가 아니므로 uv 가 빌드하지 않게 막습니다.
package = false

# ── 윈도우에서만 CUDA torch 를 받습니다 (2026-09-05) ──────────────────
# PyPI 의 윈도우 torch 휠은 **CPU 전용**입니다. 그냥 `torch>=2.2` 로 두면
# `2.13.0+cpu` 가 깔리고, `torch.cuda.is_available()` 이 조용히 False 가 됩니다.
# 로컬 GPU(RTX 3050)로 추론을 돌리는데 몇 시간씩 걸려서야 알았습니다 —
# `env.require_gpu()` 는 학습 노트북에서만 부르므로 도구에서는 안 걸립니다.
#
# ⚠️ 마커로 **윈도우에만** 묶었습니다. Colab·Kaggle(리눅스)은 이미 CUDA torch 가
#    깔려 있고 노트북 첫 셀은 이 extra 를 안 씁니다 — 거기 해석을 건드리면 안 됩니다.
# ⚠️ cu126 은 이 PC 드라이버(CUDA 12.6, nvidia-smi 실측)에 맞춘 것입니다.
#    드라이버가 더 낮은 PC 로 옮기면 여기를 낮춰야 합니다.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]
