<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='52'>🐾</text></svg>">
<title>댕스 AI 챗봇 — 이미지 진단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* ══════════════════════════════════════════════════════════════
   색은 전부 DAENGS 앱의 ui/theme/Color.kt 에서 그대로 가져왔습니다.
   앱이 라이트 전용이라(Theme.kt 주석) 이 데모도 라이트 하나로 고정합니다 —
   대신 모든 색을 명시해서 뷰어 테마와 무관하게 같게 보이도록 했습니다.
   ══════════════════════════════════════════════════════════════ */
:root{
  --cream-bg:#FDF1EC;      /* CreamBg      */
  --card:#FFFFFF;          /* CardWhite    */
  --pink:#F0A0A0;          /* DaengPink    */
  --pink-deep:#E08585;     /* DaengPinkDeep*/
  --pink-soft:#FBE4E0;     /* PinkSoft     */
  --pink-faint:#F7ECE8;    /* PinkFaint    */
  --ink:#4A3B36;           /* TextDark     */
  --muted:#A79089;         /* TextMuted    */
  /* 판정 색 — 아트 팔레트에서 빌려옵니다 */
  --safe:#7FC98F;          /* RoomPalette.GhostValid  */
  --alert:#E87F7F;         /* RoomPalette.GhostInvalid*/
  --shadow:0 2px 10px rgba(91,68,56,.07);
  --display:'Jua','Noto Sans KR',system-ui,sans-serif;
  --sans:'Noto Sans KR','Apple SD Gothic Neo',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--cream-bg); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
  /* 한국어는 어절 단위로 끊어야 합니다. 기본값이면 "권합니 / 다." 처럼
     낱말 가운데가 잘립니다 — 실제로 그렇게 나왔습니다. */
  word-break:keep-all; overflow-wrap:anywhere;
  display:flex; justify-content:center;
}

/* ── 휴대폰 ── */
.phone{
  width:100%; max-width:411px; background:var(--cream-bg);
  display:flex; flex-direction:column; height:100dvh;
}
@media (min-width:520px){
  body{padding:22px 0; background:#F6EAE5}
  .phone{height:calc(100dvh - 44px); border-radius:26px; overflow:hidden;
         box-shadow:0 8px 40px rgba(91,68,56,.13)}
}

/* ── 상단바 (DaengsTopBar) ── */
.topbar{
  flex:none; background:var(--cream-bg); padding:12px 16px 10px;
  display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--pink-soft);
}
.brand{font-family:var(--display); font-size:21px; color:var(--pink-deep); line-height:1}
.brand small{display:block; font-size:8.5px; letter-spacing:.22em; color:var(--muted);
  font-family:var(--sans); font-weight:500; margin-top:2px}
.tabs{display:flex; gap:16px; margin-left:auto; align-items:center}
.tab{display:flex; flex-direction:column; align-items:center; gap:1px;
  font-size:10.5px; color:var(--muted); font-weight:500}
.tab.on{color:var(--pink-deep)}
.tab svg{width:19px;height:19px}
.avatar{
  width:31px;height:31px;border-radius:50%;background:var(--pink-soft);
  display:grid;place-items:center;font-size:16px;flex:none;margin-left:4px;
}

/* ── 챗 헤더 ── */
.chat-head{
  flex:none; display:flex; align-items:center; gap:6px;
  padding:13px 16px 9px;
}
.chat-head h1{font-family:var(--display); font-size:17px; margin:0; font-weight:400;
  color:var(--ink); letter-spacing:.01em}
.chat-head .more{margin-left:auto; font-size:12px; color:var(--muted); display:flex;
  align-items:center; gap:1px}

/* ── 메시지 영역 ── */
.log{
  flex:1; overflow-y:auto; padding:4px 14px 14px;
  display:flex; flex-direction:column; gap:13px;
  scrollbar-width:thin; scrollbar-color:var(--pink-soft) transparent;
}
.log::-webkit-scrollbar{width:5px}
.log::-webkit-scrollbar-thumb{background:var(--pink-soft); border-radius:99px}

.msg{display:flex; gap:8px; align-items:flex-end; animation:rise .28s ease-out}
@keyframes rise{from{opacity:0; transform:translateY(7px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){
  .msg{animation:none}
  .dots i{animation:none !important}
}
.msg.me{flex-direction:row-reverse}
.face{
  width:33px;height:33px;border-radius:50%;background:var(--pink-soft);flex:none;
  display:grid;place-items:center;font-size:17px;margin-bottom:1px;
}
.bubble{
  max-width:82%; background:var(--card); border-radius:19px 19px 19px 5px;
  padding:11px 15px; box-shadow:var(--shadow); font-size:14px; line-height:1.62;
}
.me .bubble{
  background:var(--pink); color:#fff; border-radius:19px 19px 5px 19px;
  box-shadow:0 2px 10px rgba(224,133,133,.28);
}
.me .bubble img{display:block; border-radius:13px; max-width:190px; width:100%}
.bubble p{margin:0}
.bubble p + p{margin-top:7px}
.time{font-size:10px; color:var(--muted); align-self:flex-end; margin-bottom:3px; flex:none}

/* 타이핑 표시 */
.dots{display:flex; gap:4px; padding:4px 2px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--pink);display:block;
  animation:bob 1.1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.16s}
.dots i:nth-child(3){animation-delay:.32s}
@keyframes bob{0%,60%,100%{opacity:.32; transform:translateY(0)} 30%{opacity:1; transform:translateY(-4px)}}

/* ══════════════════════════════════════════════════════════════
   진단 결과 카드 — 표시 규칙은 docs/cautions/03 §7-B 입니다.
   고치기 전에 그 문서를 읽어주세요. 요약:
     · 1등을 굵게/크게 쓰지 않습니다 (여섯 줄 같은 무게)
     · 여섯 개를 전부 보여줍니다
     · "판단할 수 없습니다" 가 숫자보다 위
     · 면책 문구를 숨기지 않습니다
   ══════════════════════════════════════════════════════════════ */
/* 결과는 표라서 말풍선보다 넓게 씁니다 (문장 버블은 82% 그대로) */
.bubble.result{max-width:calc(100% - 41px); padding:13px 15px 14px}
.vt{display:flex; align-items:center; gap:8px}
.vt .dot{width:9px;height:9px;border-radius:50%;flex:none}
.vt b{font-size:14.5px; font-weight:700; letter-spacing:-.01em}
.gauge{margin:11px 0 2px}
.gauge .r{display:flex; justify-content:space-between; font-size:11.5px;
  color:var(--muted); margin-bottom:5px; font-variant-numeric:tabular-nums}
.track{height:7px; background:var(--pink-faint); border-radius:99px; overflow:hidden}
.fill{height:100%; border-radius:99px; transition:width .5s cubic-bezier(.2,.7,.3,1)}
.cant{
  background:var(--pink-faint); border-radius:12px; padding:10px 12px; margin:13px 0 2px;
  font-size:12.5px; font-weight:700; color:var(--ink); line-height:1.5;
}
.cant span{display:block; font-weight:400; color:var(--muted); font-size:11.5px; margin-top:3px}
.dist{margin-top:12px; display:flex; flex-direction:column; gap:9px}
.row{display:grid; grid-template-columns:1fr auto; gap:3px 8px}
.row .n{font-size:12.5px; font-weight:400}      /* ★ 굵게 쓰지 않습니다 */
.row .v{font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums}
.row .track{grid-column:1/-1; height:6px}
.row .fill{background:var(--pink)}
.cta{
  margin-top:13px; padding:11px 13px; border-radius:13px; text-align:center;
  line-height:1.45;
  font-size:13.5px; font-weight:700; background:var(--pink-soft); color:var(--pink-deep);
}
.disc{
  font-size:10.5px; color:var(--muted); line-height:1.55;
  margin-top:11px; padding-top:10px; border-top:1px solid var(--pink-faint);
}
.body-t{font-size:13px; color:var(--muted); margin-top:9px}
details{margin-top:9px}
summary{font-size:11px; color:var(--muted); cursor:pointer; list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:'▸ '}
details[open] summary::before{content:'▾ '}
pre{background:var(--pink-faint); border-radius:9px; padding:10px; overflow-x:auto;
  font-size:10px; line-height:1.6; margin:7px 0 0; color:var(--ink)}

/* ══════════════════════════════════════════════════════════════
   가이드 프레임 — 이 네모가 그대로 bbox 로 갑니다.
   1단계(f320)는 네모의 **중심만**, 2단계(m2.5)는 **크기**를 씁니다.
   그래서 고정 프레임이 아니라 **끌고 늘릴 수 있어야** 합니다.
   ══════════════════════════════════════════════════════════════ */
.framer{
  position:relative; border-radius:15px; overflow:hidden; margin-top:10px;
  background:#000; touch-action:none; user-select:none; cursor:move;
}
.framer img{display:block; width:100%; opacity:.62}
.hole{
  position:absolute; border:2.5px solid #fff; border-radius:10px;
  box-shadow:0 0 0 9999px rgba(74,59,54,.5); cursor:move; z-index:2;
}
.hole::after{
  content:''; position:absolute; right:-9px; bottom:-9px; width:19px; height:19px;
  background:var(--pink); border:2.5px solid #fff; border-radius:50%; cursor:nwse-resize;
}
.hole.bad{border-color:#FFD9D9; box-shadow:0 0 0 9999px rgba(120,50,50,.55)}
.hole.bad::after{background:#D96B6B}
/* 안내는 네모의 어둠막(box-shadow) **위**에 와야 합니다 — 밑에 두면
   글씨가 같이 어두워져서 안 읽힙니다 (실제로 그렇게 나왔습니다). */
.tip{
  position:absolute; left:0; right:0; bottom:0; padding:8px 12px; font-size:11.5px;
  color:#fff; background:rgba(40,30,26,.72); text-align:center; z-index:3;
  pointer-events:none;
}
.tip b{color:#FFE2DC}
/* 촬영 가이드 — 헛알림을 실제로 줄일 수 있는 **유일한** 문구입니다.
   holdout 7,134장에서 부위별 헛알림률이 털 덮인 순서 그대로였습니다
   (연접부 16.6% → 다리 41.0%, 2.5배). 같은 부위 안에서도 잔선이 적게 찍힌
   사진이 낫습니다(`hair` AUROC 0.727). 거리·조명은 무관했습니다 — 그래서
   여기엔 **털 이야기만** 씁니다. 근거: docs/results/헛알림_사진통계_실측.md */
.hairtip{
  display:flex; gap:7px; align-items:flex-start;
  margin-top:9px; padding:9px 11px; border-radius:12px;
  background:var(--pink-faint); border:1px solid var(--pink-soft);
  font-size:12px; line-height:1.55; color:var(--pink-deep);
}
.hairtip b{color:var(--pink-deep)}
.hairtip span{color:var(--muted); font-size:11px}
/* 두 갈래 고르기 */
.pick{display:flex; gap:8px; margin-top:11px}
.pick button{
  flex:1; font-family:inherit; font-size:13px; font-weight:700; cursor:pointer;
  border-radius:14px; padding:14px 8px; border:1px solid var(--pink-soft);
  background:var(--pink-faint); color:var(--pink-deep);
  display:flex; flex-direction:column; align-items:center; gap:5px;
}
.pick button:hover{background:var(--pink-soft)}
.pick button svg{width:21px;height:21px}
.pick button small{font-weight:400; font-size:11px; color:var(--muted)}
.sample{
  width:100%; margin-top:8px; font-family:inherit; font-size:12.5px; font-weight:500;
  cursor:pointer; border:1px dashed var(--pink-soft); border-radius:12px; padding:10px;
  background:transparent; color:var(--muted);
}
.sample:hover{background:var(--pink-faint); color:var(--pink-deep)}

/* 카메라 */
.cam{position:relative; border-radius:15px; overflow:hidden; margin-top:10px;
     background:#000; touch-action:none; user-select:none}
.cam video{display:block; width:100%; background:#000}
.shutter{
  width:56px;height:56px;border-radius:50%;background:var(--pink);border:4px solid #fff;
  margin:11px auto 0; display:block; cursor:pointer; box-shadow:0 2px 10px rgba(224,133,133,.4);
}
.shutter:disabled{background:var(--pink-soft); border-color:var(--pink-faint); cursor:default}

.crop-act{display:flex; gap:8px; margin-top:9px}
.crop-act button{
  flex:1; font-family:inherit; font-size:13.5px; font-weight:700; cursor:pointer;
  border-radius:13px; padding:11px; border:1px solid var(--pink-soft);
  background:var(--pink-faint); color:var(--pink-deep);
}
.crop-act .ok{background:var(--pink); color:#fff; border-color:var(--pink); flex:1.6}
.crop-act .ok:disabled{background:var(--pink-soft); color:var(--muted); border-color:var(--pink-soft); cursor:default}

/* ── 아래 조작부 ── */
.dock{flex:none; background:var(--cream-bg); padding:2px 14px 14px}
.chips{display:flex; gap:8px; overflow-x:auto; padding:8px 0 10px;
  scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none; font-family:inherit; font-size:12.5px; font-weight:500; cursor:pointer;
  background:var(--pink-faint); color:var(--pink-deep); border:1px solid var(--pink-soft);
  border-radius:99px; padding:8px 15px; white-space:nowrap;
}
.chip:hover{background:var(--pink-soft)}
/* ★ 이미지 진단 — 이 데모의 주된 동선이라 하나만 채워 씁니다 */
.chip.primary{
  background:var(--pink); color:#fff; border-color:var(--pink);
  display:inline-flex; align-items:center; gap:6px; font-weight:700;
  box-shadow:0 2px 9px rgba(224,133,133,.3);
}
.chip.primary:hover{background:var(--pink-deep); border-color:var(--pink-deep)}
.chip.primary svg{width:15px;height:15px}
.chip:focus-visible,.send:focus-visible,#input:focus-visible{
  outline:2px solid var(--pink-deep); outline-offset:2px}

.entry{display:flex; align-items:center; gap:9px}
.field{
  flex:1; height:44px; background:var(--card); border-radius:23px;
  display:flex; align-items:center; padding:0 18px; box-shadow:var(--shadow);
}
#input{
  border:0; outline:0; background:none; width:100%; font-family:inherit;
  font-size:14px; color:var(--ink);
}
#input::placeholder{color:var(--muted)}
.send{
  width:42px;height:42px;border-radius:50%;background:var(--pink);border:0;flex:none;
  display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 9px rgba(224,133,133,.3);
}
.send:hover{background:var(--pink-deep)}
.send svg{width:20px;height:20px}
input[type=file]{display:none}

.mockbar{
  flex:none; font-size:10.5px; color:var(--pink-deep); background:var(--pink-soft);
  text-align:center; padding:5px 12px; font-weight:500;
}
</style>
</head>
<body>
<div class="phone">

  <!-- 상단바 — DaengsTopBar 를 얇게 옮겼습니다 -->
  <div class="topbar">
    <div class="brand">댕스<small>DAENGS</small></div>
    <div class="tabs">
      <div class="tab on">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 3 10.2V21h6v-6h6v6h6V10.2z"/></svg>
        홈
      </div>
      <div class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
          <path d="M5 4h13a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H5z"/><path d="M9 4v17"/></svg>
        기록
      </div>
      <div class="avatar">🐶</div>
    </div>
  </div>

  <div id="mockbar" class="mockbar" hidden></div>

  <div class="chat-head">
    <h1>댕스 AI 챗봇</h1>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="#F0A0A0"><circle cx="7" cy="8" r="2.4"/><circle cx="12.6" cy="6" r="2.4"/><circle cx="17.6" cy="9" r="2.2"/><ellipse cx="12" cy="16" rx="5" ry="4.2"/></svg>
    <span class="more">추천 질문 보기 ›</span>
  </div>

  <!-- 메시지 -->
  <div class="log" id="log" role="log" aria-live="polite"></div>

  <!-- 조작부 -->
  <div class="dock">
    <div class="chips">
      <!-- ★ 이 데모의 주 동선 -->
      <button class="chip primary" id="diagBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linejoin="round"><path d="M3 8.5h3.5L8 6h8l1.5 2.5H21v11H3z"/>
          <circle cx="12" cy="13.5" r="3.4"/></svg>
        이미지 진단
      </button>
      <button class="chip">오늘 산책 언제가 좋을까?</button>
      <button class="chip">강아지 더위 주의사항 알려줘!</button>
      <button class="chip">간식 추천해줘!</button>
    </div>
    <div class="entry">
      <div class="field">
        <input id="input" placeholder="무엇이든 물어보세요!" autocomplete="off">
      </div>
      <button class="send" id="sendBtn" aria-label="보내기">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M4 20.5 21 12 4 3.5 4 10l11 2-11 2z"/></svg>
      </button>
    </div>
  </div>

  <!-- 두 갈래. capture 를 붙이면 휴대폰에서 카메라가 바로 열립니다 -->
  <input id="fileAlbum" type="file" accept="image/*">
  <input id="fileCam" type="file" accept="image/*" capture="environment">
</div>

<script>
const $  = s => document.querySelector(s);
const log = $('#log');
const DOT = {abnormal:'#E87F7F', normal:'#7FC98F', retake:'#A79089'};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now = () => new Date().toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'});

let isMock = false;
fetch('/healthz').then(r => r.json()).then(h => {
  isMock = !!h.mock;
  if (isMock) {
    const b = $('#mockbar');
    b.hidden = false;
    b.textContent = '⚠️ mock 모드 — 화면 확인용입니다. 숫자는 모델이 낸 것이 아닙니다.';
  }
}).catch(() => {});

/* ── 말풍선 ── */
function bubble(who, inner, {raw = false} = {}) {
  const wrap = document.createElement('div');
  wrap.className = 'msg' + (who === 'me' ? ' me' : '');
  wrap.innerHTML =
    (who === 'me' ? '' : '<div class="face">🐶</div>') +
    `<div class="bubble${raw ? ' result' : ''}">${inner}</div>` +
    `<span class="time">${now()}</span>`;
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
  return wrap;
}

function typing() {
  const w = bubble('bot', '<div class="dots"><i></i><i></i><i></i></div>');
  return () => w.remove();
}

/* 🐾 이모지는 시스템 폰트에서 파랗게 나옵니다 — 브랜드 색 발자국을 씁니다 */
const PAW = '<svg width="14" height="14" viewBox="0 0 24 24" fill="#F0A0A0" ' +
  'style="vertical-align:-2px"><circle cx="7" cy="8" r="2.4"/><circle cx="12.6" cy="6" r="2.4"/>' +
  '<circle cx="17.6" cy="9" r="2.2"/><ellipse cx="12" cy="16" rx="5" ry="4.2"/></svg>';

/* ── 첫 인사 ── */
bubble('bot',
  '<p>안녕! 나는 <b>댕스 AI</b>야 ' + PAW + '</p>' +
  '<p>피부가 이상해 보이면 <b>이미지 진단</b>을 눌러줘. ' +
  '<b>찍어도 되고</b>, 가지고 있는 사진을 <b>올려도 돼</b>. ' +
  '병원에 가볼지 판단하는 걸 도와줄게.</p>');

/* ── 이미지 진단 — 찍기 / 첨부 두 갈래 ── */
$('#diagBtn').addEventListener('click', pickStep);
$('#fileAlbum').addEventListener('change', e => { take(e.target.files[0]); e.target.value = ''; });
$('#fileCam').addEventListener('change', e => { take(e.target.files[0]); e.target.value = ''; });

function take(f) { if (f && f.type.startsWith('image/')) frameStep(f); }

/* 첨부는 파일 고르기 말고도 됩니다 — 데스크톱에서 데모를 볼 때 이게 제일 빠릅니다 */
['dragenter', 'dragover'].forEach(ev =>
  document.addEventListener(ev, e => { e.preventDefault(); document.body.style.opacity = '.85'; }));
['dragleave', 'drop'].forEach(ev =>
  document.addEventListener(ev, e => { e.preventDefault(); document.body.style.opacity = ''; }));
document.addEventListener('drop', e => take(e.dataTransfer.files[0]));
document.addEventListener('paste', e => {
  const it = [...(e.clipboardData?.items || [])].find(x => x.type.startsWith('image/'));
  if (it) take(it.getAsFile());
});

/* ★ 촬영 가이드 — 한 곳에만 씁니다. 세 화면(고르기·카메라·첨부)이 같은 문구를
   나눠 쓰므로, 여기만 고치면 셋 다 바뀝니다. 문구를 늘리지 마세요 —
   촬영 거리(`area` AUROC 0.462)와 조명(밝기·채도·색온도)은 헛알림과 **무관**한
   것으로 나왔습니다. 근거 없는 줄을 더하면 지켜지는 줄까지 같이 흐려집니다. */
const HAIR_TIP =
  `<div class="hairtip"><span style="font-size:14px">🐾</span><div>
     <b>털을 헤쳐서 피부가 보이게</b> 찍어줘.<br>
     <span>털이 많이 찍히면 괜히 이상하다고 볼 수 있어.</span>
   </div></div>`;

function pickStep() {
  const w = bubble('bot',
    '<p>사진을 <b>찍을래</b>, 아니면 <b>가지고 있는 걸 올릴래</b>?</p>' + HAIR_TIP +
    `<div class="pick">
       <button id="pCam">
         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
              stroke-linejoin="round"><path d="M3 8.5h3.5L8 6h8l1.5 2.5H21v11H3z"/>
           <circle cx="12" cy="13.5" r="3.4"/></svg>
         사진 찍기<small>네모 맞추고 촬영</small></button>
       <button id="pAlbum">
         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
              stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/>
           <path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="8.5" cy="9.5" r="1.4"/></svg>
         앨범에서 고르기<small>끌어놓기·붙여넣기도 돼</small></button>
     </div>
     <button class="sample" id="pSample">사진 없이 샘플로 해볼래</button>`, {raw: true});
  w.querySelector('#pAlbum').addEventListener('click', () => { w.remove(); $('#fileAlbum').click(); });
  w.querySelector('#pCam').addEventListener('click', () => { w.remove(); cameraStep(); });
  w.querySelector('#pSample').addEventListener('click', () => { w.remove(); sampleStep(); });
}

/* ── 샘플 — 파일 선택이 막힌 곳에서도 동선을 다 볼 수 있게 ──
   ⚠️ AI Hub 데이터는 재배포 금지라 실제 사진을 넣을 수 없습니다.
      그래서 **그려낸 그림**입니다. 진짜 피부 사진이 아닙니다. */
function drawSample(seed) {
  const c = document.createElement('canvas');
  c.width = 1200; c.height = 900;
  const g = c.getContext('2d');
  let r = seed * 9301 + 49297;
  const rnd = () => ((r = (r * 9301 + 49297) % 233280) / 233280);

  const grd = g.createLinearGradient(0, 0, 1200, 900);
  grd.addColorStop(0, '#F2D9C4'); grd.addColorStop(1, '#D9B69B');
  g.fillStyle = grd; g.fillRect(0, 0, 1200, 900);
  for (let i = 0; i < 2600; i++) {                    // 털 결
    g.strokeStyle = `rgba(${140 + rnd() * 60 | 0},${105 + rnd() * 45 | 0},80,.16)`;
    g.lineWidth = 1 + rnd() * 2;
    const x = rnd() * 1200, y = rnd() * 900, a = rnd() * 6.28, len = 14 + rnd() * 26;
    g.beginPath(); g.moveTo(x, y);
    g.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len); g.stroke();
  }
  const cx = 600, cy = 450, R = 130 + rnd() * 90;     // 가운데 병변 비슷한 자국
  for (let i = 0; i < 40; i++) {
    const a = rnd() * 6.28, d = rnd() * R;
    g.fillStyle = `rgba(${180 + rnd() * 50 | 0},${90 + rnd() * 40 | 0},${80 + rnd() * 30 | 0},.5)`;
    g.beginPath();
    g.ellipse(cx + Math.cos(a) * d, cy + Math.sin(a) * d,
              18 + rnd() * 36, 14 + rnd() * 30, rnd() * 3.14, 0, 6.28);
    g.fill();
  }
  return new Promise(res => c.toBlob(b =>
    res(new File([b], `sample${seed}.jpg`, {type: 'image/jpeg'})), 'image/jpeg', 0.9));
}

async function sampleStep() {
  bubble('bot',
    '<p>샘플 사진으로 해볼게 🎨</p>' +
    '<p style="font-size:12.5px;color:#A79089">이건 <b>그려낸 그림</b>이야 — 진짜 피부 사진이 아니야. ' +
    '학습에 쓴 데이터는 재배포가 안 돼서 넣을 수 없거든.</p>');
  frameStep(await drawSample(1 + Math.floor(Math.random() * 900)));
}

/* ══════════════════════════════════════════════════════════════
   네모 조작 — 카메라와 첨부가 **같은 코드**를 씁니다.
   두 곳에 따로 두면 갈라지고, 갈라지면 한쪽만 학습과 어긋납니다.
   ══════════════════════════════════════════════════════════════ */
const BAND = {rec: [0.28, 0.48], allow: [0.24, 0.56], center: 0.10};

function attachBox(stage, hole, tip, onState) {
  // b 는 정규화 [x, y, w, h]. 이 값이 그대로 bbox 로 서버에 갑니다.
  // ⚠️ x/y 와 w/h 는 **각 축 기준**이라 w=h 를 넣으면 16:9 에서 납작해집니다.
  //    세로에 aspect 를 곱해 원본 픽셀 기준 정사각을 만듭니다.
  const b = {x: .28, y: .28, w: .44, h: .44};
  let aspect = 1;

  function setAspect(a) {
    aspect = a || 1;
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    b.w = Math.min(.44, .95 / aspect); b.h = b.w * aspect;
    b.x = Math.min(Math.max(cx - b.w / 2, 0), 1 - b.w);
    b.y = Math.min(Math.max(cy - b.h / 2, 0), 1 - b.h);
    draw();
  }

  function draw() {
    hole.style.left = b.x * 100 + '%';  hole.style.top = b.y * 100 + '%';
    hole.style.width = b.w * 100 + '%'; hole.style.height = b.h * 100 + '%';
    const off = Math.max(Math.abs(b.x + b.w / 2 - .5), Math.abs(b.y + b.h / 2 - .5));
    let msg, bad = false;
    if (b.w < BAND.allow[0]) { msg = '<b>너무 작아요</b> — 병변에 더 가까이'; bad = true; }
    else if (b.w > BAND.allow[1]) { msg = '<b>너무 커요</b> — 주변 피부도 보이게'; bad = true; }
    else if (off > BAND.center) { msg = '<b>가운데에서 벗어났어요</b>'; bad = true; }
    else if (b.w < BAND.rec[0] || b.w > BAND.rec[1]) msg = `괜찮아요 · 가로 ${(b.w * 100) | 0}%`;
    else msg = `딱 좋아요 👍 · 가로 ${(b.w * 100) | 0}%`;
    tip.innerHTML = msg;
    hole.classList.toggle('bad', bad);
    if (onState) onState(bad, b);
  }

  let mode = null, s0 = null;
  stage.addEventListener('pointerdown', e => {
    const R = stage.getBoundingClientRect();
    const px = (e.clientX - R.left) / R.width, py = (e.clientY - R.top) / R.height;
    mode = Math.hypot(px - (b.x + b.w), py - (b.y + b.h)) < .07 ? 'size' : 'move';
    s0 = {px, py, ...b};
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', e => {
    if (!mode) return;
    const R = stage.getBoundingClientRect();
    const dx = (e.clientX - R.left) / R.width - s0.px, dy = (e.clientY - R.top) / R.height - s0.py;
    if (mode === 'move') {
      b.x = Math.min(Math.max(s0.x + dx, 0), 1 - b.w);
      b.y = Math.min(Math.max(s0.y + dy, 0), 1 - b.h);
    } else {
      // **중심을 고정한 채** 늘립니다. 모서리 기준으로 늘리면 크기를 맞추는
      // 동안 가운데 정렬이 풀려서 밴드에 걸립니다 (실제로 당했습니다).
      const cx = s0.x + s0.w / 2, cy = s0.y + s0.h / 2;
      const roomX = 2 * Math.min(cx, 1 - cx), roomY = 2 * Math.min(cy, 1 - cy) / aspect;
      const k = Math.min(Math.max(s0.w + 2 * Math.max(dx, dy), .10), roomX, roomY);
      b.w = k; b.h = Math.min(k * aspect, 1);
      b.x = cx - b.w / 2; b.y = cy - b.h / 2;
    }
    draw();
  });
  ['pointerup', 'pointercancel'].forEach(ev => stage.addEventListener(ev, () => { mode = null; }));

  draw();
  return {box: b, setAspect, draw};
}

/* ── 찍기 — 카메라에 네모를 띄우고 그대로 찍습니다 ── */
async function cameraStep() {
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia(
      {video: {facingMode: 'environment', width: {ideal: 1920}}, audio: false});
  } catch (err) {
    // 브라우저가 카메라를 안 주면 (권한 거부·HTTP·데스크톱) 파일 입력으로 물러섭니다.
    // 이 페이지가 iframe 안이면 카메라 권한이 아예 막혀 있을 수 있습니다.
    // 그때는 조용히 실패하지 말고 **다른 길**을 알려줍니다.
    const w2 = bubble('bot',
      '<p>여기선 카메라를 못 열어 😢 <span style="font-size:12.5px;color:#A79089">' +
      '(브라우저가 막았어)</span></p><p>대신 이렇게 해볼래?</p>' +
      `<div class="pick" style="margin-top:9px">
         <button id="fb1">앨범에서 고르기</button>
         <button id="fb2">샘플로 해보기</button></div>`, {raw: true});
    w2.querySelector('#fb1').addEventListener('click', () => $('#fileCam').click());
    w2.querySelector('#fb2').addEventListener('click', () => { w2.remove(); sampleStep(); });
    return;
  }

  const w = bubble('bot',
    '<p>병변이 <b>네모 안에 꽉 차게</b> 맞춘 다음 찍어줘.</p>' + HAIR_TIP +
    `<div class="cam" id="cam"><video id="vid" playsinline muted></video>
       <div class="hole" id="hole"></div><div class="tip" id="tip"></div></div>
     <button class="shutter" id="shot" aria-label="촬영"></button>
     <div class="crop-act"><button id="camCancel">취소</button></div>`, {raw: true});

  const vid = w.querySelector('#vid'), shot = w.querySelector('#shot');
  vid.srcObject = stream; await vid.play().catch(() => {});

  const ui = attachBox(w.querySelector('#cam'), w.querySelector('#hole'),
                       w.querySelector('#tip'), bad => { shot.disabled = bad; });
  const fit = () => ui.setAspect((vid.videoWidth || 16) / (vid.videoHeight || 9));
  if (vid.videoWidth) fit(); else vid.addEventListener('loadedmetadata', fit);

  function stop() { stream.getTracks().forEach(t => t.stop()); w.remove(); }
  w.querySelector('#camCancel').addEventListener('click', stop);

  shot.addEventListener('click', () => {
    const c = document.createElement('canvas');
    c.width = vid.videoWidth; c.height = vid.videoHeight;
    c.getContext('2d').drawImage(vid, 0, 0);
    const box = {...ui.box};
    c.toBlob(blob => {
      stop();
      // 찍을 때 맞춘 네모를 그대로 들고 다음 단계로 — 다시 맞출 필요가 없습니다
      frameStep(new File([blob], 'camera.jpg', {type: 'image/jpeg'}), box);
    }, 'image/jpeg', 0.92);
  });
}

/* ── 첨부 — 올린 사진 위에서 네모를 맞춥니다 ── */
function frameStep(file, preset) {
  const url = URL.createObjectURL(file);
  const w = bubble('bot',
    (preset ? '<p>찍은 그대로면 <b>확인하기</b>를 눌러줘. 고치고 싶으면 네모를 다시 맞춰도 돼.</p>'
            : '<p>병변이 <b>네모 안에 꽉 차게</b> 맞춰줘. 끌어서 옮기고, 오른쪽 아래 동그라미로 크기를 바꿔.</p>'
             + HAIR_TIP) +
    `<div class="framer" id="framer"><img src="${url}" alt="올린 사진">
       <div class="hole" id="hole"></div><div class="tip" id="tip"></div></div>
     <div class="crop-act">
       <button class="ok" id="cropOk">이 부위로 확인하기</button>
       <button id="cropCancel">취소</button>
     </div>`, {raw: true});

  const okBtn = w.querySelector('#cropOk'), img = w.querySelector('#framer img');
  const ui = attachBox(w.querySelector('#framer'), w.querySelector('#hole'),
                       w.querySelector('#tip'), bad => {
    okBtn.disabled = bad;
    okBtn.textContent = bad ? '네모를 맞춰주세요' : '이 부위로 확인하기';
  });
  const fit = () => {
    ui.setAspect((img.naturalWidth || 1) / (img.naturalHeight || 1));
    if (preset) { Object.assign(ui.box, preset); ui.draw(); }
  };
  if (img.complete) fit(); else img.addEventListener('load', fit);

  w.querySelector('#cropCancel').addEventListener('click', () => w.remove());
  okBtn.addEventListener('click', () => { w.remove(); diagnose(file, url, {...ui.box}); });
}

async function diagnose(file, url, box) {
  bubble('me', `<img src="${url}" alt="올린 사진">`);
  await new Promise(r => setTimeout(r, 260));
  bubble('bot', '<p>사진 잘 받았어! 잠깐만 살펴볼게 👀</p>');
  const stop = typing();

  try {
    const fd = new FormData();
    fd.append('photo', file);
    if (box) fd.append('box', JSON.stringify([box.x, box.y, box.w, box.h]));
    const res = await fetch('/v1/screen', {method: 'POST', body: fd});
    const j = await res.json();
    stop();
    if (!res.ok) throw new Error(j.detail || res.statusText);
    bubble('bot', card(j), {raw: true});
  } catch (err) {
    stop();
    bubble('bot',
      `<p>사진을 살펴보지 못했어 😢</p><p style="color:#A79089;font-size:12.5px">${esc(err.message)}</p>`);
  }
}

/* ── 결과 카드 ── */
function card(j) {
  const c = DOT[j.verdict] || DOT.retake;
  let h = `<div class="vt"><span class="dot" style="background:${c}"></span>
             <b>${esc(j.headline)}</b></div>`;

  if (j.stage1 && j.stage1.abnormal_percent !== null) {
    const p = j.stage1.abnormal_percent;
    h += `<div class="gauge">
            <div class="r"><span>이상 가능성</span><span>${p}%</span></div>
            <div class="track"><div class="fill" style="width:${Math.min(p, 100)}%;background:${c}"></div></div>
          </div>`;
  }

  if (j.verdict === 'abnormal' && j.stage2 && j.stage2.shown) {
    // ★ "판단할 수 없습니다" 가 숫자보다 **위**에 옵니다
    h += `<div class="cant">어떤 병변인지는 이 사진만으로 판단할 수 없어요.
            <span>아래는 모델이 비슷하다고 본 정도이고, 진단이 아니에요.</span></div>`;
    // ★ 여섯 개를 **전부**, 전부 같은 굵기로. 1등을 뽑지 않습니다.
    h += '<div class="dist">' + j.stage2.distribution.map(d => `
          <div class="row"><span class="n">${esc(d.name_ko)}</span><span class="v">${d.percent}%</span>
            <div class="track"><div class="fill" style="width:${d.percent}%"></div></div>
          </div>`).join('') + '</div>';
  } else {
    // 가이드 밴드 밖이면 왜 돌려보냈는지 구체적으로 말해줍니다
    const why = j.meta && j.meta.retake_reason;
    h += `<p class="body-t">${esc(why || j.body)}</p>`;
  }

  h += `<div class="cta">${esc(j.action)}</div>`;
  h += `<p class="disc">${esc(j.disclaimer)}`;
  const bits = [];
  if (j.meta && j.meta.mock) bits.push('mock — 모델이 낸 숫자가 아님');
  if (j.stage1 && j.stage1.calibrated === false && j.stage1.abnormal_percent !== null)
    bits.push('1단계 확률 미보정');
  if (j.meta && j.meta.box_source)
    bits.push(j.meta.box_source === 'user' ? '가이드 프레임 사용' : '가이드 프레임 없음(중앙)');
  if (j.meta && j.meta.elapsed_ms != null) bits.push(j.meta.elapsed_ms + 'ms');
  if (bits.length) h += `<br>${esc(bits.join(' · '))}`;
  h += '</p>';
  h += `<details><summary>앱이 받는 JSON</summary><pre>${esc(JSON.stringify(j, null, 2))}</pre></details>`;
  return h;
}

/* ── 텍스트 대화는 아직 없습니다 (정직하게) ── */
function say() {
  const t = $('#input').value.trim();
  if (!t) return;
  $('#input').value = '';
  bubble('me', `<p>${esc(t)}</p>`);
  const stop = typing();
  setTimeout(() => {
    stop();
    bubble('bot',
      '<p>아직 대화는 배우는 중이야 🙏</p>' +
      '<p>지금은 <b>피부 사진</b>만 볼 수 있어. 아래 <b>이미지 진단</b>을 눌러줘!</p>');
  }, 700);
}
$('#sendBtn').addEventListener('click', say);
$('#input').addEventListener('keydown', e => { if (e.key === 'Enter') say(); });
document.querySelectorAll('.chip:not(.primary)').forEach(
  ch => ch.addEventListener('click', () => { $('#input').value = ch.textContent.trim(); $('#input').focus(); }));
</script>
